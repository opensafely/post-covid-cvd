version: '5.0'

actions:

  ## # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  ## DO NOT EDIT project.yaml DIRECTLY 
  ## This file is created by create_project_actions.R 
  ## Edit and run create_project_actions.R to update the project.yaml 
  ## # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  ## Define study dates 

  study_dates:
    run: r:v2 analysis/study_dates.R
    outputs:
      highly_sensitive:
        study_dates_json: output/study_dates.json

  ## Generate dates for all cohorts 

  generate_dates:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_dates.py
      --output output/dataset_definition/index_dates.csv.gz
    needs:
    - study_dates
    outputs:
      highly_sensitive:
        dataset: output/dataset_definition/index_dates.csv.gz

  ## Generate input_prevax 

  generate_input_prevax:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_prevax.py
      --output output/dataset_definition/input_prevax.csv.gz
    needs:
    - generate_dates
    outputs:
      highly_sensitive:
        cohort: output/dataset_definition/input_prevax.csv.gz

  ## Generate input_unvax 

  generate_input_unvax:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_unvax.py
      --output output/dataset_definition/input_unvax.csv.gz
    needs:
    - generate_dates
    outputs:
      highly_sensitive:
        cohort: output/dataset_definition/input_unvax.csv.gz

  ## Generate input_vax 

  generate_input_vax:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_vax.py
      --output output/dataset_definition/input_vax.csv.gz
    needs:
    - generate_dates
    outputs:
      highly_sensitive:
        cohort: output/dataset_definition/input_vax.csv.gz

  ## Generate input_prevax_clean, with describe = FALSE 

  generate_input_prevax_clean:
    run: r:v2 analysis/dataset_clean/dataset_clean.R prevax FALSE
    needs:
    - study_dates
    - generate_input_prevax
    outputs:
      moderately_sensitive:
        flow: output/dataset_clean/flow-cohort_prevax.csv
        flow_midpoint6: output/dataset_clean/flow-cohort_prevax-midpoint6.csv
      highly_sensitive:
        venn: output/dataset_clean/venn-cohort_prevax.rds
        cohort_clean: output/dataset_clean/input_prevax_clean.rds

  ## Generate input_unvax_clean, with describe = FALSE 

  generate_input_unvax_clean:
    run: r:v2 analysis/dataset_clean/dataset_clean.R unvax FALSE
    needs:
    - study_dates
    - generate_input_unvax
    outputs:
      moderately_sensitive:
        flow: output/dataset_clean/flow-cohort_unvax.csv
        flow_midpoint6: output/dataset_clean/flow-cohort_unvax-midpoint6.csv
      highly_sensitive:
        venn: output/dataset_clean/venn-cohort_unvax.rds
        cohort_clean: output/dataset_clean/input_unvax_clean.rds

  ## Generate input_vax_clean, with describe = FALSE 

  generate_input_vax_clean:
    run: r:v2 analysis/dataset_clean/dataset_clean.R vax FALSE
    needs:
    - study_dates
    - generate_input_vax
    outputs:
      moderately_sensitive:
        flow: output/dataset_clean/flow-cohort_vax.csv
        flow_midpoint6: output/dataset_clean/flow-cohort_vax-midpoint6.csv
      highly_sensitive:
        venn: output/dataset_clean/venn-cohort_vax.rds
        cohort_clean: output/dataset_clean/input_vax_clean.rds

  ## Generate table1_cohort_prevax 

  table1-cohort_prevax:
    run: r:v2 analysis/table1/table1.R prevax 18;40;60;80;111
    needs:
    - generate_input_prevax_clean
    outputs:
      moderately_sensitive:
        table1: output/table1/table1-cohort_prevax.csv
        table1_midpoint6: output/table1/table1-cohort_prevax-midpoint6.csv

  ## Generate table1_cohort_unvax 

  table1-cohort_unvax:
    run: r:v2 analysis/table1/table1.R unvax 18;40;60;80;111
    needs:
    - generate_input_unvax_clean
    outputs:
      moderately_sensitive:
        table1: output/table1/table1-cohort_unvax.csv
        table1_midpoint6: output/table1/table1-cohort_unvax-midpoint6.csv

  ## Generate table1_cohort_vax 

  table1-cohort_vax:
    run: r:v2 analysis/table1/table1.R vax 18;40;60;80;111
    needs:
    - generate_input_vax_clean
    outputs:
      moderately_sensitive:
        table1: output/table1/table1-cohort_vax.csv
        table1_midpoint6: output/table1/table1-cohort_vax-midpoint6.csv

  ## Generate make-table1-output 

  make-table1-output:
    run: r:v2 analysis/make_output/make_other_output.R table1 prevax;unvax;vax
    needs:
    - table1-cohort_prevax
    - table1-cohort_unvax
    - table1-cohort_vax
    outputs:
      moderately_sensitive:
        table1_output_midpoint6: output/make_output/table1_output_midpoint6.csv

  ## Run models 

  make_model_input-cohort_prevax-main-ami:
    run: r:v2 analysis/model/make_model_input.R cohort_prevax-main-ami
    needs:
    - generate_input_prevax_clean
    outputs:
      highly_sensitive:
        model_input: output/model/model_input-cohort_prevax-main-ami.rds

  cox_ipw-cohort_prevax-main-ami:
    run: cox-ipw:v0.0.37 --df_input=model/model_input-cohort_prevax-main-ami.rds --ipw=TRUE
      --exposure=exp_date --outcome=out_date --strata=strat_cat_region --covariate_sex=cov_cat_sex
      --covariate_age=cov_num_age --covariate_other=cov_cat_ethnicity;cov_cat_imd;cov_num_consrate2019;cov_bin_hcworker;cov_cat_smoking;cov_bin_carehome;cov_bin_obesity;cov_bin_ami;cov_bin_dementia;cov_bin_liver_disease;cov_bin_ckd;cov_bin_cancer;cov_bin_hypertension;cov_bin_diabetes;cov_bin_depression;cov_bin_copd;cov_bin_stroke_all;cov_bin_other_ae;cov_bin_vte;cov_bin_hf;cov_bin_angina;cov_bin_lipidmed;cov_bin_antiplatelet;cov_bin_anticoagulant;cov_bin_cocp;cov_bin_hrt
      --cox_start=index_date --cox_stop=end_date_outcome --study_start=2020-01-01
      --study_stop=2025-05-31 --cut_points=1;28;183;365;730;1095;1460;1979 --controls_per_case=20
      --total_event_threshold=50 --episode_event_threshold=5 --covariate_threshold=5
      --age_spline=TRUE --save_analysis_ready=FALSE --run_analysis=TRUE --df_output=model/model_output-cohort_prevax-main-ami.csv
    needs:
    - make_model_input-cohort_prevax-main-ami
    outputs:
      moderately_sensitive:
        model_output: output/model/model_output-cohort_prevax-main-ami.csv

  make_model_input-cohort_prevax-main-angina:
